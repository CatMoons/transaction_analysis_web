<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rune Scroll Icon</title>
<style>
  :root {
    /* центр и радиус диска в долях исходной картинки 1024px */
    --cx: 49.51%;
    --cy: 49.71%;
    --r: 37.9%;
  }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #111214;
  }

  .rune-icon {
    position: relative;
    width: min(80vw, 420px);
    aspect-ratio: 1;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    isolation: isolate;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .rune-icon:focus-visible { outline: 2px solid #8fd4ff; outline-offset: 6px; border-radius: 18%; }
  .rune-icon img, .rune-icon .layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* --- подвижный круг: проседает целиком, кольцо рун ещё и крутится --- */
  .disc {
    transform-origin: var(--cx) var(--cy);
    transition: transform .42s cubic-bezier(.34, 1.56, .64, 1), filter .42s ease;
  }
  .ring, .ring-glow { transform-origin: var(--cx) var(--cy); }
  .glow { mix-blend-mode: screen; opacity: 0; }
  .shade {
    background: radial-gradient(circle at var(--cx) var(--cy),
      transparent 0, transparent 30%, rgba(0, 0, 0, .55) var(--r), transparent calc(var(--r) + .2%));
    opacity: 0;
    transition: opacity .42s ease;
  }
  .wave {
    clip-path: circle(var(--r) at var(--cx) var(--cy));
  }
  .wave::before {
    content: "";
    position: absolute;
    left: var(--cx);
    top: var(--cy);
    width: 76%;
    aspect-ratio: 1;
    border-radius: 50%;
    translate: -50% -50%;
    box-shadow: 0 0 0 3px rgba(150, 220, 255, .9), 0 0 24px 8px rgba(110, 200, 255, .6),
                inset 0 0 24px 6px rgba(110, 200, 255, .5);
    scale: 0;
    opacity: 0;
  }

  .rune-icon:hover .disc { filter: brightness(1.06); }
  .rune-icon.pressed .disc {
    transform: scale(.965) translateY(.6%);
    filter: brightness(.82);
    transition: transform .12s cubic-bezier(.3, 0, .6, 1), filter .12s ease;
  }
  .rune-icon.pressed .shade { opacity: 1; transition-duration: .12s; }

  @media (prefers-reduced-motion: reduce) {
    .rune-icon.pressed .disc { transform: none; }
  }
</style>
</head>
<body>

<button class="rune-icon" type="button" aria-label="Открыть свиток">
  <img src="assets/frame.webp" alt="">
  <div class="layer disc">
    <img class="ring" src="assets/ring.webp" alt="">
    <img class="ring-glow glow" src="assets/ring-glow.webp" alt="">
    <img class="core" src="assets/core.webp" alt="">
    <img class="core-glow glow" src="assets/core-glow.webp" alt="">
    <div class="layer shade"></div>
    <div class="layer wave"></div>
  </div>
  <img src="assets/overlay.webp" alt="">
</button>

<script>
  document.querySelectorAll('.rune-icon').forEach((icon) => {
    const rotating = icon.querySelectorAll('.ring, .ring-glow');
    const ringGlow = icon.querySelector('.ring-glow');
    const coreGlow = icon.querySelector('.core-glow');
    const wave = icon.querySelector('.wave');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    let angle = 0;
    let spins = [];

    const currentAngle = (el) => {
      const t = getComputedStyle(el).transform;
      if (!t || t === 'none') return 0;
      const m = new DOMMatrixReadOnly(t);
      return Math.atan2(m.b, m.a) * 180 / Math.PI;
    };

    function release() {
      if (!icon.classList.contains('pressed')) return;
      icon.classList.remove('pressed');

      if (!reduced.matches) {
        // кольцо рун: полный оборот, в покое всегда возвращается в исходное положение
        const from = spins.length ? currentAngle(rotating[0]) : 0;
        spins.forEach((a) => a.cancel());
        const to = (from > 0 ? 360 : 0) + 360;
        spins = [...rotating].map((el) => el.animate(
          [{ transform: `rotate(${from}deg)` }, { transform: `rotate(${to}deg)` }],
          { duration: 1100, easing: 'cubic-bezier(.15, .75, .25, 1)' }
        ));
        spins[0].onfinish = () => { spins = []; };

        wave.animate(
          [{ scale: 0.35, opacity: 1 }, { scale: 1.05, opacity: 0 }],
          { duration: 650, easing: 'cubic-bezier(.2, .7, .3, 1)', pseudoElement: '::before' }
        );
      }
      ringGlow.animate(
        [{ opacity: 0 }, { opacity: 1, offset: .15 }, { opacity: 0 }],
        { duration: 1000, easing: 'ease-out' }
      );
      coreGlow.animate(
        [{ opacity: 0, filter: 'blur(0)' }, { opacity: .9, filter: 'blur(2px)', offset: .2 }, { opacity: 0, filter: 'blur(0)' }],
        { duration: 800, easing: 'ease-out' }
      );
      icon.dispatchEvent(new CustomEvent('rune-activate', { bubbles: true }));
    }

    icon.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      icon.setPointerCapture(e.pointerId);
      icon.classList.add('pressed');
    });
    icon.addEventListener('pointerup', release);
    icon.addEventListener('pointercancel', () => icon.classList.remove('pressed'));
    icon.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) {
        e.preventDefault();
        icon.classList.add('pressed');
      }
    });
    icon.addEventListener('keyup', (e) => {
      if (e.key === 'Enter' || e.key === ' ') release();
    });
  });
</script>
</body>
</html>
